<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>初診 歯式入力</title>
<style>
:root{--ink:#1f2a44;--sub:#667085;--line:#cfd6df;--teal:#12857b;--teal-bg:#dff3f0;--br:#6d3bd1;--br-bg:#efe9fc;--red:#d33a3a}
*{box-sizing:border-box}
html,body{margin:0;background:#f2f5f7;color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;font-size:15px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.4}
.app{max-width:1240px;margin:0 auto;padding:10px 14px 24px}
header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end;margin-bottom:8px}
h1{font-size:20px;margin:0 6px 5px 0;white-space:nowrap}
.acts{display:flex;gap:6px;margin-left:auto}
.btn{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:#fff;white-space:nowrap}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700;padding:0 18px}
.btn.on{background:var(--teal-bg);border-color:var(--teal);color:var(--teal);font-weight:700}
.chart{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.lab{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr)) 10px repeat(8,minmax(0,1fr));column-gap:3px}
.bars{height:22px}
.teeth{height:72px;touch-action:none;user-select:none;-webkit-user-select:none}
.teeth.pri{height:58px;margin-top:3px}
.teeth.pri .no{height:20px}
.teeth.pri.lo{margin:0 0 3px}
.vP .teeth.pri,.vD .teeth:not(.pri){display:none}
.vD .teeth.pri{height:72px}
.vD .bars{visibility:hidden}
.mline{grid-column:9;grid-row:1;justify-self:center;width:2px;background:var(--teal)}
.t{grid-row:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:1px;min-width:0;padding:2px 1px;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:5px;touch-action:none}
.lo .t{flex-direction:column-reverse}
.t .codes>span{flex:none}
.t .codes{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-weight:700;line-height:1.1;overflow:hidden;overflow-wrap:anywhere;text-align:center}
.lo .t .codes{justify-content:flex-start}
.t .no{flex:none;display:grid;place-items:center;width:24px;height:24px;font-style:normal;font-weight:700;font-size:15px;color:var(--sub)}
.t.sel{background:var(--teal-bg);border:2px solid var(--teal)}
.t.pont,.t.abut{background:var(--br-bg);border-color:var(--br)}
.t.pont .no{color:var(--br)}
.t.abut .no{color:var(--br);border:2.5px solid var(--br);border-radius:50%;background:#fff}
.bar{grid-row:1;position:relative;align-self:end;height:12px;margin:0 8px;border:3px solid var(--br);border-bottom:0;border-radius:4px 4px 0 0}
.lo .bar{align-self:start;border:3px solid var(--br);border-top:0;border-radius:0 0 4px 4px}
.bar b{position:absolute;left:50%;top:-9px;transform:translateX(-50%);padding:0 7px;background:var(--br);color:#fff;border-radius:9px;font-size:12px;line-height:17px}
.lo .bar b{top:auto;bottom:-9px}
.mid{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:12px;margin:8px 0;align-items:stretch}
.side{display:flex;flex-direction:column;gap:7px;min-width:0}
.seg{display:flex;gap:6px}.seg .btn{flex:1;padding:0 4px}
.who{font-weight:700;min-height:44px;line-height:1.35}
.hint{font-size:12px;color:var(--sub);line-height:1.45;margin:0}
.chk{display:flex;gap:6px;align-items:center;font-size:13px}
.brbox{display:none;flex-direction:column;gap:7px;padding:10px;border:2px solid var(--br);border-radius:8px;background:var(--br-bg)}
.brbox b{color:var(--br);font-size:16px}
.brbox ol{list-style:none;margin:0;padding:0;line-height:1.7;font-size:14px}
.brbox .btn{border-color:var(--br)}
.brbox .btn.fin{background:var(--br);color:#fff;font-weight:700}
.brmode .norm{display:none}.brmode .brbox{display:flex}
.sch{position:relative;justify-self:center;align-self:center;height:clamp(250px,calc(100vh - 340px),430px);aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none}
.vB .sch{height:clamp(250px,calc(100vh - 464px),430px)}
.sch img,.sch canvas{position:absolute;inset:0;width:100%;height:100%;-webkit-user-drag:none}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;align-content:start}
.ab{min-height:38px;padding:2px 3px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--c);font-weight:700;font-size:14px;line-height:1.15}
.ab.s{font-size:11.5px}
.ab.has{background:var(--c);color:#fff;border-color:var(--c)}
.ab.br{grid-column:1/-1;min-height:46px;color:var(--br);border:2px solid var(--br);font-size:17px}
.brmode .ab.br{background:var(--br);color:#fff}
.ab.o{color:var(--ink);font-weight:400}
.low{margin-top:10px}
.low h2{font-size:13px;margin:0 0 4px;color:var(--sub)}
#brlist{margin:0;padding:0;list-style:none;font-size:15px;line-height:1.5}
#brlist .w{color:var(--red);font-size:13px}
#brlist .e{color:var(--sub);font-size:13px}
.ovl{position:fixed;inset:0;z-index:4;display:grid;place-items:center;padding:16px;background:rgba(20,28,44,.6)}
.ovl[hidden]{display:none}
.svbox h2{margin:0;font-size:17px}
#edForm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#edName{flex:1 1 160px;min-width:0;height:44px;padding:0 10px;border:1px solid var(--line);border-radius:6px;font-size:16px}
#edCols{display:flex;gap:6px}
.col{width:36px;height:36px;padding:0;border:3px solid #fff;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px var(--line)}
.col.on{box-shadow:0 0 0 3px var(--ink)}
.col.sm{flex:none;width:32px;height:32px}
.cols{display:flex;flex:none;gap:6px;align-items:center}
#edForm .btn{height:44px}
#edList{position:relative;flex:1;min-height:0;overflow:auto;margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
#edList li{display:flex;align-items:center;gap:6px;padding:5px 2px;background:#fff;border-bottom:1px solid var(--line);cursor:grab;user-select:none;-webkit-user-select:none}
#edList li.drag{position:relative;z-index:1;background:var(--teal-bg);box-shadow:0 2px 10px rgba(20,28,44,.3);cursor:grabbing}
.grip{flex:none;width:48px;height:40px;padding:0;border:0;border-radius:6px;background:none;color:var(--sub);font-size:22px;line-height:1;touch-action:none;cursor:grab;-webkit-touch-callout:none}
#edList b{flex:1;min-width:0;overflow-wrap:anywhere}
#edList .btn{height:36px}
.svbox{display:flex;flex-direction:column;gap:10px;width:min(620px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);padding:14px;background:#fff;border-radius:10px}
.svbox img{flex:1;min-height:0;width:100%;object-fit:contain;border:1px solid var(--line)}
.svbox .hint{font-size:14px;color:var(--ink)}
.svbox .btn{height:46px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:9px 16px;border-radius:8px;background:var(--ink);color:#fff;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
#toast.on{opacity:1}
@media(max-width:980px){.mid{grid-template-columns:1fr}.sch,.vB .sch{height:min(78vw,430px);order:-1}.acts{margin-left:0}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>初診 歯式入力</h1>
    <div class="acts">
      <button class="btn" id="undo" type="button">もどる</button>
      <button class="btn" id="redo" type="button">すすむ</button>
      <button class="btn" id="reset" type="button">新しい患者</button>
      <button class="btn pri" id="save" type="button">画像で保存</button>
    </div>
  </header>

  <section class="chart">
    <div class="lab"><span>右上</span><span>左上</span></div>
    <div class="grid bars" id="barsU"></div>

    <div class="grid teeth pri" id="rowDU"></div>

      <div class="side">
        <div class="norm side">
          <div class="seg"><button class="btn" id="vP" type="button">永久歯</button><button class="btn" id="vD" type="button">乳歯</button><button class="btn" id="vB" type="button">両方</button></div>
          <div class="who" id="who"></div>

          <button class="btn" id="clear" type="button">選んだ歯の記入を消す</button>

        </div>

const UP=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28],LO=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
const DU=[55,54,53,52,51,61,62,63,64,65],DL=[85,84,83,82,81,71,72,73,74,75];
const ORDER_P=[...UP,...[...LO].reverse()],ORDER_D=[...DU,...[...DL].reverse()];
const QN={1:'右上',2:'左上',3:'左下',4:'右下',5:'右上',6:'左上',7:'左下',8:'右下'};
const quad=n=>QN[Math.floor(n/10)];
const num=n=>n>=50?'ABCDE'[n%10-1]:String(n%10);
const tname=n=>quad(n)+num(n);
const archOf=n=>UP.includes(n)?UP:LO.includes(n)?LO:null;
const BLUE='#2a6fd6',RED='#d33a3a',GREEN='#1b9e5a',ORANGE='#c26a00',BLACK='#1f2a44',BR='#6d3bd1',TEAL='#12857b';
const CODES0=[['〇',BLACK],['×',BLACK],['CR',BLUE],['アマルガム',BLUE],['In',BLUE],['CAD In',BLUE],['Cr',BLUE],['FMC',BLUE],['前装冠',BLUE],['CAD',BLUE],['セラミッククラウン',BLUE],
  ['WSD',RED],['C1',RED],['C2',RED],['C3',RED],['C4',RED],['晩期残存',RED],['半埋伏',GREEN],['IP',GREEN]];
const KEY='shishiki-codes';
let CODES=CODES0;try{const s=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(s)&&s.length)CODES=s}catch(e){}
// 一覧から消した略号も、記入済みの歯は同じ色のままにする
const seen={};const remember=()=>{for(const [t,c] of CODES)seen[t]=c};remember();
const codeColor=t=>seen[t]||BLACK;
function saveCodes(){remember();try{localStorage.setItem(KEY,JSON.stringify(CODES))}catch(e){toast('この端末には略号を保存できませんでした')}}
// シェーマの図（840×840）の中の歯の中心
const TXY=[[382,112],[338,125],[293,150],[254,181],[218,216],[190,265],[168,320],[157,380]],DXY=[[386,240],[346,256],[314,286],[286,326],[266,370]];
function toothXY(n){const q=Math.floor(n/10),i=n%10,p=q>=5,[x,y]=(p?DXY:TXY)[i-1],l=[2,3,6,7].includes(q),b=[3,4,7,8].includes(q);
  return [l?840-x:x,b?860-y:y,p?16:i<=3?19:i<=5?23:27]}

// 記入の内容はこの画面の中だけに持ち、どこにも送らず保存もしない
let D={marks:{},br:[]},sel=new Set([18]),autoSel=true,view='P',brMode=false,cur=null,past=[],future=[],dirty=false,nextId=1,drag=null;

function snap(){past.push(JSON.stringify(D));if(past.length>200)past.shift();future=[];dirty=true}
function restore(from,to){if(!from.length)return;to.push(JSON.stringify(D));D=JSON.parse(from.pop());if(!D.br.some(b=>b.id===cur))cur=null;render()}
const brOf=n=>D.br.find(b=>b.t[n]);
const role=n=>{const b=brOf(n);return b?b.t[n]:null};
const brTeeth=b=>{const a=archOf(+Object.keys(b.t)[0]);return a.filter(n=>b.t[n])};

// ブリッジ：1回でポンティック、2回で支台歯（〇）、3回で外す
function tapBr(n){
  if(n>=50){toast('ブリッジは永久歯に入れます');return}
  snap();
  const b=brOf(n);
  if(b){cur=b.id;if(b.t[n]==='p')b.t[n]='a';else{delete b.t[n];if(!Object.keys(b.t).length){D.br=D.br.filter(x=>x!==b);cur=null}}}
  else{let c=D.br.find(x=>x.id===cur);
    if(!c||archOf(+Object.keys(c.t)[0])!==archOf(n)){c={id:nextId++,t:{}};D.br.push(c);cur=c.id}
    c.t[n]='p'}
  render();
}
function setBrMode(on){brMode=on;cur=null;if(on){sel.clear();if(view==='D')view='B'}render()}
function brString(b){const ts=brTeeth(b),s=n=>b.t[n]==='a'?'①②③④⑤⑥⑦⑧'[n%10-1]:num(n),parts=[];
  for(const q of [...new Set(ts.map(quad))])parts.push(q+' '+ts.filter(n=>quad(n)===q).map(s).join(''));
  return parts.join('｜')+' Br'}
function brWarn(b){const ts=brTeeth(b),a=archOf(ts[0]),i0=a.indexOf(ts[0]),i1=a.indexOf(ts[ts.length-1]),w=[];
  const gap=a.slice(i0,i1+1).filter(n=>!b.t[n]);
  if(gap.length)w.push('間の歯が入っていません（'+gap.map(tname).join('・')+'）');
  if(!ts.some(n=>b.t[n]==='a'))w.push('支台歯がありません');
  return w}

// 歯の選択と略号
// 永久歯／乳歯／両方の切り替え。隠れた歯は選択から外す
const shown=n=>view==='B'||(view==='D')===(n>=50);
function setView(v){view=v;sel=new Set([...sel].filter(shown));if(!sel.size){sel=new Set([v==='D'?55:18]);autoSel=true}render()}
// シェーマで隠れている側の歯を押したら「両方」にする
function reveal(n){if(!shown(n))view='B'}
function pick(n){if(autoSel){sel.clear();autoSel=false}reveal(n)}
function pressCode(c){if(!sel.size)return;snap();
  const ts=[...sel],all=ts.every(n=>(D.marks[n]||[]).includes(c));
  for(const n of ts){const m=D.marks[n]||[];
    if(all){const r=m.filter(x=>x!==c);if(r.length)D.marks[n]=r;else delete D.marks[n]}
    else if(!m.includes(c))D.marks[n]=[...m,c]}
  if(!all&&ts.length===1&&$('auto').checked)move(1);else render()}
function move(d){const f=[...sel][0],o=f>=50||(!sel.size&&view==='D')?ORDER_D:ORDER_P;
  const i=sel.size?o.indexOf(f)+d:d>0?0:o.length-1;
  if(i<0||i>=o.length){render();return}
  sel=new Set([o[i]]);autoSel=true;render()}

// 押した場所の歯（枠・シェーマとも）
function toothAt(e){const el=document.elementFromPoint(e.clientX,e.clientY);if(!el)return null;
  const t=el.closest('[data-n]');if(t)return +t.dataset.n;
  if(el!==$('ov'))return null;
  const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*840,y=(e.clientY-r.top)/r.height*840;let best=null,bd=1e9;
  for(const n of [...UP,...LO,...DU,...DL]){const [a,b,rad]=toothXY(n),d=Math.hypot(a-x,b-y);if(d<rad+12&&d<bd){bd=d;best=n}}
  return best}
document.addEventListener('pointerdown',e=>{const n=toothAt(e);if(!n)return;
  e.preventDefault();if(e.target.hasPointerCapture&&e.target.hasPointerCapture(e.pointerId))e.target.releasePointerCapture(e.pointerId);
  if(brMode){tapBr(n);return}
  const wasAuto=autoSel;pick(n);
  const on=wasAuto||!sel.has(n);drag={on,seen:new Set([n])};
  if(on)sel.add(n);else sel.delete(n);render()});
document.addEventListener('pointermove',e=>{if(!drag)return;const n=toothAt(e);if(!n||drag.seen.has(n))return;
  drag.seen.add(n);reveal(n);if(drag.on)sel.add(n);else sel.delete(n);render()});
document.addEventListener('pointerup',()=>drag=null);
document.addEventListener('pointercancel',()=>drag=null);
document.addEventListener('click',e=>{if(e.detail!==0)return;const t=e.target.closest&&e.target.closest('.t');if(!t)return;
  const n=+t.dataset.n;if(brMode){tapBr(n);return}pick(n);if(sel.has(n))sel.delete(n);else sel.add(n);render()});

// 画面
// ポンティックは欠損なので × を自動で出す。記入のデータには入れないので、支台歯に変えたり外したりすると消える
function marksOf(n){const m=D.marks[n]||[];return role(n)==='p'&&!m.includes('×')?['×',...m]:m}
function cellHtml(n,col){const m=marksOf(n),r=role(n),len=m.join('').length+m.length,fs=len>16?9:len>9?10.5:len>5?12:14;
  const cl=['t',sel.has(n)?'sel':'',r==='a'?'abut':r==='p'?'pont':''].join(' ');
  const say=tname(n)+(r==='a'?' 支台歯':r==='p'?' ポンティック':'')+(m.length?' '+m.join(' '):'');
  return `<button type="button" class="${cl}" data-n="${n}" style="grid-column:${col}" aria-label="${esc(say)}" aria-pressed="${sel.has(n)}"><span class="codes" style="font-size:${fs}px">${m.map(t=>`<span style="color:${codeColor(t)}">${esc(t)}</span>`).join('')}</span><i class="no">${num(n)}</i></button>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const colP=i=>i<8?i+1:i+2,colD=i=>i<5?i+4:i+5;
const rowHtml=(a,col)=>'<i class="mline"></i>'+a.map((n,i)=>cellHtml(n,col(i))).join('');
function barsHtml(arch){return D.br.filter(b=>archOf(+Object.keys(b.t)[0])===arch).map(b=>{const ts=brTeeth(b),a=colP(arch.indexOf(ts[0])),z=colP(arch.indexOf(ts[ts.length-1]));
    return `<div class="bar" style="grid-column:${a}/${z+1}"><b>Br</b></div>`}).join('')}
function padHtml(){const has=c=>sel.size&&[...sel].every(n=>(D.marks[n]||[]).includes(c)),off=brMode||!sel.size?'disabled':'';
  return `<button type="button" class="ab br" id="brBtn">Br（ブリッジ）</button>`+CODES.map(([t,c],i)=>`<button type="button" class="ab ${t.length>4?'s':''} ${has(t)?'has':''}" style="--c:${c}" data-c="${i}" ${off}>${esc(t)}</button>`).join('')+`<button type="button" class="ab o s" data-free="1" ${off}>その他（文字）</button><button type="button" class="ab o s" id="edBtn">＋ 略号を足す</button>`}
function drawX(c,x,y,r){c.strokeStyle=codeColor('×');c.lineWidth=7;c.lineCap='round';c.beginPath();c.moveTo(x-r,y-r);c.lineTo(x+r,y+r);c.moveTo(x+r,y-r);c.lineTo(x-r,y+r);c.stroke()}
function drawOverlay(c,showSel){
  for(const n in D.marks)if(D.marks[n].includes('×')){const [x,y,r]=toothXY(+n);drawX(c,x,y,r)}
  for(const b of D.br){const ts=brTeeth(b),ps=ts.map(toothXY);
    c.strokeStyle=BR;c.lineWidth=7;c.lineCap='round';c.lineJoin='round';c.beginPath();ps.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();
    ts.forEach((n,i)=>{const [x,y,r]=ps[i];
      if(b.t[n]==='a'){c.strokeStyle=BR;c.lineWidth=7;c.beginPath();c.arc(x,y,r+6,0,7);c.stroke()}else drawX(c,x,y,r)});
    const m=ps[Math.floor((ps.length-1)/2)],m2=ps[Math.ceil((ps.length-1)/2)];let lx=(m[0]+m2[0])/2,ly=(m[1]+m2[1])/2;
    const dx=lx-420,dy=ly-430,dl=Math.hypot(dx,dy)||1;lx=Math.min(806,Math.max(34,lx+dx/dl*80));ly=Math.min(820,Math.max(20,ly+dy/dl*80));
    c.fillStyle=BR;c.beginPath();c.roundRect(lx-30,ly-19,60,38,19);c.fill();
    c.fillStyle='#fff';c.font='700 26px "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('Br',lx,ly+1)}
  if(showSel)for(const n of sel){const [x,y,r]=toothXY(n);c.strokeStyle=TEAL;c.lineWidth=6;c.beginPath();c.arc(x,y,r+4,0,7);c.stroke()}
}
function render(){
  $('app').className='app v'+view+(brMode?' brmode':'');
  const nd=Object.keys(D.marks).filter(n=>n>=50).length;
  for(const v of 'PDB')$('v'+v).className='btn'+(view===v?' on':'');$('vD').textContent='乳歯'+(nd?`（${nd}）`:'');
  $('rowU').innerHTML=rowHtml(UP,colP);$('rowL').innerHTML=rowHtml(LO,colP);$('rowDU').innerHTML=rowHtml(DU,colD);$('rowDL').innerHTML=rowHtml(DL,colD);
  $('barsU').innerHTML=barsHtml(UP);$('barsL').innerHTML=barsHtml(LO);
  $('pad').innerHTML=padHtml();
  // 枠に入りきらない略号は字を小さくする
  document.querySelectorAll('.t .codes').forEach(e=>{if(!e.firstChild||!e.offsetParent)return;const need=()=>[...e.children].reduce((a,c)=>a+c.getBoundingClientRect().height,0);let s=parseFloat(e.style.fontSize);while(need()>e.clientHeight&&s>7){s-=.5;e.style.fontSize=s+'px'}});
  const s=[...sel];$('who').textContent=s.length?'選んだ歯：'+s.map(tname).join('・'):'歯を押して選んでください';
  $('clear').disabled=!s.length;$('undo').disabled=!past.length;$('redo').disabled=!future.length;
  const c=$('ov').getContext('2d');c.setTransform(2,0,0,2,0,0);c.clearRect(0,0,840,840);drawOverlay(c,true);
  $('brlist').innerHTML=D.br.length?D.br.map(b=>`<li>${esc(brString(b))}${brWarn(b).map(w=>`<div class="w">${esc(w)}</div>`).join('')}</li>`).join(''):'<li class="e">「Br（ブリッジ）」を押して入力します</li>';
}
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}

// 保存する画像：歯式の部分だけ（氏名・日付などは入れない）
const FONT='"Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif';
function wrap(c,text,w){const out=[];for(const para of String(text).split('\n')){let l='';for(const ch of para){if(l&&c.measureText(l+ch).width>w){out.push(l);l=ch}else l+=ch}out.push(l)}return out}
function fitCodes(c,codes,w,h){for(let s=15;s>=7;s-=.5){c.font=`700 ${s}px ${FONT}`;const ls=[];
    for(const t of codes){const parts=c.measureText(t).width>w?t.split(' '):[t];for(const p of parts)for(const l of wrap(c,p,w))ls.push([l,codeColor(t)])}
    if(ls.length*s*1.18<=h||s===7)return{s,ls}}}
function drawCell(c,x,y,w,h,n,top){const r=role(n);
  c.fillStyle=r?'#efe9fc':'#fff';c.strokeStyle=r?BR:'#9aa4b2';c.lineWidth=r?1.3:.8;c.beginPath();c.roundRect(x,y,w,h,3);c.fill();c.stroke();
  const ny=top?y+h-13:y+13;
  if(r==='a'){c.strokeStyle=BR;c.fillStyle='#fff';c.lineWidth=2;c.beginPath();c.arc(x+w/2,ny,10,0,7);c.fill();c.stroke()}
  c.fillStyle=r?BR:'#667085';c.font=`700 14px ${FONT}`;c.textAlign='center';c.textBaseline='middle';c.fillText(num(n),x+w/2,ny+.5);
  const m=marksOf(n);if(!m.length)return;
  const ah=h-29,{s,ls}=fitCodes(c,m,w-5,ah);c.font=`700 ${s}px ${FONT}`;c.textBaseline='top';const lh=s*1.18;
  const y0=top?y+h-27-ls.length*lh:y+27;ls.forEach(([l,col],i)=>{c.fillStyle=col;c.fillText(l,x+w/2,y0+i*lh)})}
function drawBars(c,arch,xOf,cw,y,top){for(const b of D.br){if(archOf(+Object.keys(b.t)[0])!==arch)continue;const ts=brTeeth(b),a=xOf(arch.indexOf(ts[0]))+6,z=xOf(arch.indexOf(ts[ts.length-1]))+cw-6,e=top?y+7:y-7;
    c.strokeStyle=BR;c.lineWidth=2.4;c.lineJoin='round';c.beginPath();c.moveTo(a,e);c.lineTo(a,y);c.lineTo(z,y);c.lineTo(z,e);c.stroke();
    c.fillStyle=BR;c.beginPath();c.roundRect((a+z)/2-15,y-9,30,18,9);c.fill();c.fillStyle='#fff';c.font=`700 12px ${FONT}`;c.textAlign='center';c.textBaseline='middle';c.fillText('Br',(a+z)/2,y+.5)}}
function renderChart(){const K=2,W=800,M=14,hasD=[...DU,...DL].some(n=>marksOf(n).length),fh=76,dh=62,sz=hasD?400:440;
  const H=M+10+16+10+fh+3+(hasD?dh+3:0)+6+sz+6+(hasD?dh+3:0)+fh+10+20+M;
  const cv=document.createElement('canvas');cv.width=W*K;cv.height=H*K;
  const c=cv.getContext('2d');c.scale(K,K);c.fillStyle='#fff';c.fillRect(0,0,W,H);
  const cw=(W-2*M-14)/16,xP=i=>M+i*cw+(i>=8?14:0),xD=i=>xP(i+3);
  const lab=(l,r,y)=>{c.fillStyle='#667085';c.font=`700 12px ${FONT}`;c.textBaseline='alphabetic';c.textAlign='left';c.fillText(l,M,y);c.textAlign='right';c.fillText(r,W-M,y)};
  let y=M+10;lab('右上','左上',y);
  y+=16;drawBars(c,UP,xP,cw,y,true);y+=10;
  UP.forEach((n,i)=>drawCell(c,xP(i)+1,y,cw-2,fh,n,true));y+=fh+3;
  if(hasD){DU.forEach((n,i)=>drawCell(c,xD(i)+1,y,cw-2,dh,n,true));y+=dh+3}
  y+=6;c.save();c.translate((W-sz)/2,y);c.scale(sz/840,sz/840);c.drawImage($('schImg'),0,0,840,840);drawOverlay(c,false);c.restore();y+=sz+6;
  if(hasD){DL.forEach((n,i)=>drawCell(c,xD(i)+1,y,cw-2,dh,n,false));y+=dh+3}
  LO.forEach((n,i)=>drawCell(c,xP(i)+1,y,cw-2,fh,n,false));y+=fh+10;
  drawBars(c,LO,xP,cw,y,false);y+=20;lab('右下','左下',y);
  return cv}

// 略号の編集（この端末に覚える。記入済みの歯はそのまま）
const PALETTE=[[BLUE,'青'],[RED,'赤'],[GREEN,'緑'],[ORANGE,'オレンジ'],[BLACK,'黒']];
let edColor=BLUE,edPick=null; // edPick: 色を選んでいる略号
function drawEditor(){
  $('edCols').innerHTML=PALETTE.map(([c,n])=>`<button type="button" class="col ${c===edColor?'on':''}" style="--c:${c}" data-col="${c}" role="radio" aria-checked="${c===edColor}" aria-label="${n}"></button>`).join('');
  $('edList').innerHTML=CODES.map(([t,c],i)=>`<li data-i="${i}"><button class="grip" type="button" aria-label="${esc(t)}の順番を動かす（上下の矢印キーでも動きます）">≡</button><b style="color:${c}">${esc(t)}</b><span class="cols">${t===edPick?PALETTE.map(([k,n])=>`<button type="button" class="col sm ${k===c?'on':''}" style="--c:${k}" data-re="${i}" data-rc="${k}" aria-label="${esc(t)}を${n}にする"></button>`).join(''):`<button type="button" class="col sm" style="--c:${c}" data-pick="${i}" aria-label="${esc(t)}の色を変える"></button>`}</span><button class="btn" type="button" data-del="${i}" aria-label="${esc(t)}を削除">削除</button></li>`).join('')}
function openEditor(){edPick=null;$('ed').hidden=false;drawEditor();$('edName').focus()}
function codesChanged(){saveCodes();drawEditor();render()}
$('edForm').addEventListener('submit',e=>{e.preventDefault();const n=$('edName').value.trim();if(!n)return;
  if(n==='Br'){toast('Br は上のボタンで入れます');return}
  if(CODES.some(c=>c[0]===n)){toast(n+' はすでにあります');return}
  CODES=[...CODES,[n,edColor]];$('edName').value='';codesChanged();const l=$('edList');l.scrollTop=l.scrollHeight;$('edName').focus()});
$('ed').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.col){edColor=d.col;drawEditor()}
  else if(d.pick){edPick=CODES[+d.pick][0];drawEditor()}
  else if(d.re){edPick=null;CODES=CODES.map((c,i)=>i===+d.re?[c[0],d.rc]:c);codesChanged()}
  else if(d.del){CODES=CODES.filter((c,i)=>i!==+d.del);codesChanged()}});
$('edClose').onclick=()=>$('ed').hidden=true;
// ドラッグで並べ替え。つかんだ行は DOM から動かさず、まわりの行を入れ替える（動かすとポインタのキャプチャが切れる）
const edL=$('edList');let ord=null;
function ordStep(){if(!ord)return;const {li,y}=ord,r=edL.getBoundingClientRect(),E=44;
  if(y<r.top+E)edL.scrollTop-=8;else if(y>r.bottom-E)edL.scrollTop+=8;
  const top=y-r.top+edL.scrollTop-ord.off,mid=top+li.offsetHeight/2;let p,n;
  while((n=li.nextElementSibling)&&mid>n.offsetTop+n.offsetHeight/2)edL.insertBefore(n,li);
  while((p=li.previousElementSibling)&&mid<p.offsetTop+p.offsetHeight/2)li.after(p);
  const max=edL.scrollHeight-li.offsetHeight;
  li.style.transform=`translateY(${Math.max(0,Math.min(max,top))-li.offsetTop}px)`;
  ord.raf=requestAnimationFrame(ordStep)}
function ordEnd(e){if(!ord||e.pointerId!==ord.id)return;cancelAnimationFrame(ord.raf);ord=null;
  const a=[...edL.children].map(l=>CODES[+l.dataset.i]);
  if(e.type==='pointerup'&&a.some((c,i)=>c!==CODES[i])){CODES=a;codesChanged()}else drawEditor()}
edL.addEventListener('pointerdown',e=>{const li=e.target.closest('li');if(!li||ord||e.button)return;
  // 指は ≡ だけ（行をなぞると一覧がスクロールする）。マウスは行のどこでも
  if(!e.target.closest('.grip')&&(e.pointerType!=='mouse'||e.target.closest('button')))return;
  e.preventDefault();const r=li.getBoundingClientRect();
  ord={li,id:e.pointerId,y:e.clientY,off:e.clientY-r.top};li.classList.add('drag');
  edL.setPointerCapture(e.pointerId);ordStep()});
edL.addEventListener('pointermove',e=>{if(ord&&e.pointerId===ord.id)ord.y=e.clientY});
edL.addEventListener('pointerup',ordEnd);edL.addEventListener('pointercancel',ordEnd);
edL.addEventListener('touchmove',e=>{if(ord)e.preventDefault()},{passive:false});
edL.addEventListener('keydown',e=>{const g=e.target.closest('.grip'),k={ArrowUp:-1,ArrowDown:1}[e.key];if(!g||!k)return;
  e.preventDefault();const i=+g.closest('li').dataset.i,j=i+k;if(!CODES[j])return;
  const a=[...CODES];[a[i],a[j]]=[a[j],a[i]];CODES=a;codesChanged();edL.children[j].querySelector('.grip').focus()});
$('edReset').onclick=()=>{if(confirm('足した略号を消して、最初の並びに戻しますか？')){CODES=CODES0;codesChanged()}};

// iPad は共有シートの「画像を保存」で写真に入る。共有が使えないページ（https でないとき）は画像の長押しで保存する
let svFile=null,svUrl=null;
const isTouch=()=>navigator.maxTouchPoints>1;
async function openSave(){
  const ws=D.br.flatMap(b=>brWarn(b).map(w=>brString(b)+'：'+w));
  if(ws.length&&!confirm('ブリッジの入力を確かめてください。\n\n'+ws.join('\n')+'\n\nこのまま画像にしますか？'))return;
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const img=$('schImg');if(!img.complete)await new Promise(r=>img.onload=r);
  const blob=await new Promise(r=>renderChart().toBlob(r,'image/jpeg',.92)),d=new Date(),p=v=>String(v).padStart(2,'0');
  const name=`歯式_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.jpg`;
  svFile=new File([blob],name,{type:'image/jpeg'});if(svUrl)URL.revokeObjectURL(svUrl);svUrl=URL.createObjectURL(blob);$('svImg').src=svUrl;
  const share=isTouch()&&navigator.canShare&&navigator.canShare({files:[svFile]});
  $('svSave').dataset.share=share?'1':'';$('svSave').textContent=share?'写真に保存':isTouch()?'ファイルに保存':'JPGを保存';
  $('svHint').textContent=share?'「写真に保存」を押し、開いた画面で「画像を保存」を選ぶと、写真に入ります。':isTouch()?'上の画像を長押しして「写真に保存」を選ぶと、写真に入ります。':'JPGファイルとして保存します。';
  $('sv').hidden=false}
async function doSave(){
  if($('svSave').dataset.share){try{await navigator.share({files:[svFile]});dirty=false}catch(e){if(e.name!=='AbortError'){console.error(e);toast('共有できませんでした。画像を長押しして保存してください')}}return}
  const a=document.createElement('a');a.href=svUrl;a.download=svFile.name;document.body.append(a);a.click();a.remove();dirty=false;toast('保存しました：'+svFile.name)}

$('pad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id==='brBtn'){setBrMode(!brMode);return}
  if(b.id==='edBtn'){openEditor();return}
  if(b.dataset.free){const t=(prompt('入れる文字（例：根充、要再評価）')||'').trim();if(t)pressCode(t);return}
  pressCode(CODES[+b.dataset.c][0])});
$('vP').onclick=()=>setView('P');$('vD').onclick=()=>setView('D');$('vB').onclick=()=>setView('B');
$('undo').onclick=()=>restore(past,future);$('redo').onclick=()=>restore(future,past);
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
$('clear').onclick=()=>{if(!sel.size)return;snap();for(const n of sel){delete D.marks[n];const b=brOf(n);if(b){delete b.t[n];if(!Object.keys(b.t).length)D.br=D.br.filter(x=>x!==b)}}render()};
$('brNext').onclick=()=>{cur=null;toast('次のブリッジの歯を押してください')};
$('brEnd').onclick=()=>setBrMode(false);
$('save').onclick=()=>openSave().catch(e=>{console.error(e);toast('画像を作れませんでした')});
$('svSave').onclick=doSave;$('svClose').onclick=()=>$('sv').hidden=true;
$('reset').onclick=()=>{if(dirty&&!confirm('いまの入力を消して、新しい患者を始めますか？'))return;
  D={marks:{},br:[]};past=[];future=[];dirty=false;sel=new Set([18]);autoSel=true;view='P';brMode=false;cur=null;render()};
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
render();
</script>
</body>
</html>
